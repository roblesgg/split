<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="split — control de gastos, ingresos y reparto del sueldo.">
  <meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>split</title>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/emoji.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components/card.css">
  <link rel="stylesheet" href="css/components/data.css">
  <link rel="stylesheet" href="css/components/row.css">
  <link rel="stylesheet" href="css/components/pick.css">
  <link rel="stylesheet" href="css/components/controls.css">
  <link rel="stylesheet" href="css/components/sheet.css">
  <link rel="stylesheet" href="css/components/field.css">
  <link rel="stylesheet" href="css/components/category.css">
  <link rel="stylesheet" href="css/components/feedback.css">
  <link rel="stylesheet" href="css/charts.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body>

<div class="app" id="app">

  <!-- ============ barra lateral (escritorio) ============ -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand__mark">s</span>
      <span class="brand__name">split</span>
    </div>

    <nav class="sidenav" id="sidenav" aria-label="Secciones">
      <button type="button" class="navitem" data-view="inicio" aria-selected="true">
        <span class="navitem__icon" data-icon="home" data-icon-size="18"></span>
        <span>Resumen</span>
      </button>
      <button type="button" class="navitem" data-view="movs" aria-selected="false">
        <span class="navitem__icon" data-icon="list" data-icon-size="18"></span>
        <span>Movimientos</span>
      </button>
      <button type="button" class="navitem" data-view="analisis" aria-selected="false">
        <span class="navitem__icon" data-icon="chart" data-icon-size="18"></span>
        <span>Análisis</span>
      </button>
      <button type="button" class="navitem" data-view="ahorro" aria-selected="false">
        <span class="navitem__icon" data-icon="wallet" data-icon-size="18"></span>
        <span>Mi dinero</span>
      </button>
    </nav>

    <button type="button" class="btn btn--primary sidebar__add" data-add>
      <span data-icon="plus" data-icon-size="17"></span>
      <span>Nuevo movimiento</span>
    </button>

    <div class="sidebar__spacer"></div>

    <div class="sidebar__foot">
      <button type="button" class="navitem" data-view="ajustes" aria-selected="false">
        <span class="navitem__icon" data-icon="gear" data-icon-size="18"></span>
        <span>Ajustes</span>
      </button>
    </div>
  </aside>

  <!-- ============ contenido ============ -->
  <div class="frame">
    <header class="topbar" id="topbar">
      <button type="button" class="avatar" data-view="ajustes" aria-label="Tu perfil y ajustes"
              data-icon="user" data-icon-size="20"></button>
      <div class="topbar__titles">
        <p class="topbar__eyebrow" id="topbarEyebrow">Resumen</p>
        <h1 class="topbar__title" id="topbarTitle">Resumen</h1>
      </div>
      <div class="topbar__actions">
        <button type="button" class="icon-btn" id="themeBtn" aria-label="Cambiar tema"></button>
        <button type="button" class="icon-btn" id="settingsBtn" aria-label="Ajustes"
                data-icon="gear" data-icon-size="18"></button>
      </div>
    </header>

    <main class="viewport">
      <div class="scroll-area" id="scrollArea">
        <div class="scroll-inner">
          <section class="view" id="view-inicio"   data-active="true"  aria-label="Resumen"></section>
          <section class="view" id="view-movs"     data-active="false" aria-label="Movimientos"></section>
          <section class="view" id="view-analisis" data-active="false" aria-label="Análisis"></section>
          <section class="view" id="view-ahorro"   data-active="false" aria-label="Mi dinero"></section>
          <section class="view" id="view-ajustes"  data-active="false" aria-label="Ajustes"></section>
        </div>
      </div>
    </main>
  </div>

  <!-- ============ tab bar (móvil) ============ -->
  <nav class="tabbar" id="tabbar" role="tablist" aria-label="Secciones">
    <button type="button" class="tab" role="tab" data-view="inicio" aria-selected="true"
            aria-label="Resumen">
      <span class="tab__icon" data-icon="home" data-icon-size="24"></span>
    </button>

    <button type="button" class="tab" role="tab" data-view="movs" aria-selected="false"
            aria-label="Movimientos">
      <span class="tab__icon" data-icon="list" data-icon-size="24"></span>
    </button>

    <button type="button" class="tab tab--add" data-add aria-label="Nuevo movimiento">
      <span class="fab" data-icon="plus" data-icon-size="20"></span>
    </button>

    <button type="button" class="tab" role="tab" data-view="analisis" aria-selected="false"
            aria-label="Análisis">
      <span class="tab__icon" data-icon="chart" data-icon-size="24"></span>
    </button>

    <button type="button" class="tab" role="tab" data-view="ahorro" aria-selected="false"
            aria-label="Mi dinero: cuentas, recibos y metas">
      <span class="tab__icon" data-icon="wallet" data-icon-size="24"></span>
    </button>
  </nav>

  <!-- ============ capa modal ============ -->
  <div class="scrim" id="scrim" data-open="false"></div>

  <div class="sheet" id="sheetAdd" data-open="false" role="dialog" aria-modal="true"
       aria-labelledby="sheetAddTitle" aria-hidden="true">
    <div class="sheet__grabber" aria-hidden="true"></div>
    <div class="sheet__head">
      <h2 class="sheet__title" id="sheetAddTitle">Nuevo movimiento</h2>
      <button type="button" class="icon-btn" data-sheet-close aria-label="Cerrar"
              data-icon="close" data-icon-size="16"></button>
    </div>
    <div class="sheet__body" id="sheetAddBody"></div>
  </div>

  <div class="sheet" id="sheetDetail" data-open="false" role="dialog" aria-modal="true"
       aria-labelledby="sheetDetailTitle" aria-hidden="true">
    <div class="sheet__grabber" aria-hidden="true"></div>
    <div class="sheet__head">
      <h2 class="sheet__title" id="sheetDetailTitle">Movimiento</h2>
      <button type="button" class="icon-btn" data-sheet-close aria-label="Cerrar"
              data-icon="close" data-icon-size="16"></button>
    </div>
    <div class="sheet__body" id="sheetDetailBody"></div>
  </div>

  <!-- formulario genérico: cuentas, metas y programados -->
  <div class="sheet" id="sheetForm" data-open="false" role="dialog" aria-modal="true"
       aria-labelledby="sheetFormTitle" aria-hidden="true">
    <div class="sheet__grabber" aria-hidden="true"></div>
    <div class="sheet__head">
      <h2 class="sheet__title" id="sheetFormTitle">Editar</h2>
      <button type="button" class="icon-btn" data-sheet-close aria-label="Cerrar"
              data-icon="close" data-icon-size="16"></button>
    </div>
    <div class="sheet__body" id="sheetFormBody"></div>
  </div>

  <!-- elegir una opción de una lista, con la pinta del resto de la app -->
  <div class="sheet" id="sheetPick" data-open="false" role="dialog" aria-modal="true"
       aria-labelledby="sheetPickTitle" aria-hidden="true">
    <div class="sheet__grabber" aria-hidden="true"></div>
    <div class="sheet__head">
      <h2 class="sheet__title" id="sheetPickTitle">Elegir</h2>
      <button type="button" class="icon-btn" data-sheet-close aria-label="Cerrar"
              data-icon="close" data-icon-size="16"></button>
    </div>
    <div class="sheet__body" id="sheetPickBody"></div>
  </div>

  <!-- una cuenta por dentro: saldo, su mes y sus últimos movimientos -->
  <div class="sheet" id="sheetCuenta" data-open="false" role="dialog" aria-modal="true"
       aria-labelledby="sheetCuentaTitle" aria-hidden="true">
    <div class="sheet__grabber" aria-hidden="true"></div>
    <div class="sheet__head">
      <h2 class="sheet__title" id="sheetCuentaTitle">Cuenta</h2>
      <button type="button" class="icon-btn" data-sheet-close aria-label="Cerrar"
              data-icon="close" data-icon-size="16"></button>
    </div>
    <div class="sheet__body" id="sheetCuentaBody"></div>
  </div>

  <!-- confirmar un programado que pidió que le preguntaran el importe -->
  <div class="sheet" id="sheetCobro" data-open="false" role="dialog" aria-modal="true"
       aria-labelledby="sheetCobroTitle" aria-hidden="true">
    <div class="sheet__grabber" aria-hidden="true"></div>
    <div class="sheet__head">
      <h2 class="sheet__title" id="sheetCobroTitle">¿Cuánto ha sido?</h2>
      <button type="button" class="icon-btn" data-sheet-close aria-label="Cerrar"
              data-icon="close" data-icon-size="16"></button>
    </div>
    <div class="sheet__body" id="sheetCobroBody"></div>
  </div>

  <!-- ============ tutorial de bienvenida (solo la primera vez) ============ -->
  <div class="onboard" id="onboard" data-open="false" role="dialog" aria-modal="true"
       aria-labelledby="onboardTitle" aria-hidden="true">
    <div class="onboard__card">
      <button type="button" class="onboard__skip" id="onboardSkip">Saltar</button>
      <div class="onboard__icon" id="onboardIcon"></div>
      <h2 class="onboard__title" id="onboardTitle"></h2>
      <p class="onboard__text" id="onboardText"></p>
      <div class="onboard__extra" id="onboardExtra"></div>
      <div class="onboard__dots" id="onboardDots" aria-hidden="true"></div>
      <div class="onboard__actions">
        <button type="button" class="btn btn--ghost" id="onboardBack">Atrás</button>
        <button type="button" class="btn btn--primary" id="onboardNext">Siguiente</button>
      </div>
    </div>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
</div>

<!-- capa de datos: el espacio común primero, la fachada al final -->
<script src="js/core/base.js"></script>
<script src="js/core/format.js"></script>
<script src="js/core/dates.js"></script>
<script src="js/data/ciclo.js"></script>
<script src="js/data/catalog.js"></script>
<script src="js/data/demo.js"></script>
<script src="js/data/state.js"></script>
<script src="js/data/tx.js"></script>
<script src="js/data/accounts.js"></script>
<script src="js/data/categories.js"></script>
<script src="js/data/tags.js"></script>
<script src="js/data/goals.js"></script>
<script src="js/data/recurring.js"></script>
<script src="js/data/pendientes.js"></script>
<script src="js/data/budget.js"></script>
<script src="js/data/select.js"></script>
<script src="js/data/prefs.js"></script>
<script src="js/store.js"></script>
<script src="js/update.js"></script>
<script src="js/attach.js"></script>
<script src="js/avisos.js"></script>
<script src="js/ui.js"></script>
<!-- motor de gráficos: un archivo por tipo, la fachada al final -->
<script src="js/charts/espacio.js"></script>
<script src="js/charts/base.js"></script>
<script src="js/charts/line.js"></script>
<script src="js/charts/columns.js"></script>
<script src="js/charts/sparkline.js"></script>
<script src="js/charts/donut.js"></script>
<script src="js/charts/ring.js"></script>
<script src="js/charts/heatmap.js"></script>
<script src="js/charts/breakdown.js"></script>
<script src="js/charts.js"></script>
<!-- base de la interfaz: estado, ayudantes y registro de pantallas -->
<script src="js/app/base.js"></script>
<script src="js/app/parts.js"></script>
<script src="js/app/shell.js"></script>

<!-- una pantalla u hoja por archivo; cada una se registra sola -->
<script src="js/screens/inicio.js"></script>
<script src="js/screens/movs.js"></script>
<script src="js/screens/analisis.js"></script>
<script src="js/screens/planes.js"></script>
<script src="js/screens/form.js"></script>
<script src="js/screens/form-render.js"></script>
<script src="js/screens/ajustes.js"></script>
<script src="js/screens/ajustes-render.js"></script>
<script src="js/screens/add.js"></script>
<script src="js/screens/add-render.js"></script>
<script src="js/screens/detail.js"></script>
<script src="js/screens/pick.js"></script>
<script src="js/screens/cuenta.js"></script>
<script src="js/screens/cobro.js"></script>
<script src="js/screens/onboard.js"></script>

<!-- el último: monta las hojas, engancha el cableado y pinta -->
<script src="js/app/init.js"></script>
</body>
</html>
